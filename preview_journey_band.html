<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Journey Band Preview</title>
    <style>
        :root {
            --mmc-blue: #2F35FF;
            --mmc-blue-deep: #1D239D;
            --mmc-black: #0B0B0D;
            --mmc-surface: #15151A;
            --mmc-text: #F7F7FA;
            --mmc-muted: #B7B7C6;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--mmc-black);
            color: var(--mmc-text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .preview-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .journey-band {
            width: 100%;
            max-width: 980px;
            background:
                linear-gradient(
                    145deg,
                    rgba(28, 28, 35, 0.96),
                    rgba(18, 18, 23, 0.92)
                );
            border: 1px solid rgba(247, 247, 250, 0.12);
            border-radius: 1rem;
            padding: 2rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .journey-title {
            color: var(--mmc-muted);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 1.4rem;
            text-align: center;
        }

        .journey-track {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0;
        }

        /* The glowing baseline */
        .journey-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            background: linear-gradient(
                90deg,
                rgba(47, 53, 255, 0.15) 0%,
                rgba(47, 53, 255, 0.9) 45%,
                rgba(47, 53, 255, 0.9) 55%,
                rgba(47, 53, 255, 0.15) 100%
            );
            transform: translateY(-50%);
            z-index: 0;
            filter: drop-shadow(0 0 6px rgba(47, 53, 255, 0.7));
        }

        .journey-step {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .journey-pill {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 0.7rem;
            border-radius: 999px;
            background: rgba(47, 53, 255, 0.12);
            border: 1px solid rgba(47, 53, 255, 0.35);
            color: #E9E9FF;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .journey-pill:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.32);
        }

        .journey-icon {
            width: 1.1rem;
            height: 1.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(47, 53, 255, 0.25);
            color: #FFFFFF;
            font-size: 0.65rem;
            font-weight: 800;
        }

        .journey-label {
            color: var(--mmc-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            max-width: 6rem;
        }

        @media (max-width: 640px) {
            .journey-band {
                padding: 1.25rem 0.75rem;
            }

            .journey-pill {
                padding: 0.35rem 0.55rem;
                font-size: 0.7rem;
            }

            .journey-label {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="preview-wrapper">
        <div class="journey-band">
            <div class="journey-title">Your intelligence workflow</div>
            <div class="journey-track">
                <div class="journey-line"></div>

                <div class="journey-step">
                    <div class="journey-pill">
                        <span class="journey-icon">S</span>
                        <span>Signal</span>
                    </div>
                    <div class="journey-label">What deserves attention</div>
                </div>

                <div class="journey-step">
                    <div class="journey-pill">
                        <span class="journey-icon">P</span>
                        <span>Pattern</span>
                    </div>
                    <div class="journey-label">What keeps happening</div>
                </div>

                <div class="journey-step">
                    <div class="journey-pill">
                        <span class="journey-icon">A</span>
                        <span>Action</span>
                    </div>
                    <div class="journey-label">Who owns the next move</div>
                </div>

                <div class="journey-step">
                    <div class="journey-pill">
                        <span class="journey-icon">L</span>
                        <span>Learning</span>
                    </div>
                    <div class="journey-label">What we carry forward</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
