[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#2F35FF"
backgroundColor = "#0B0B0D"
secondaryBackgroundColor = "#15151A"
textColor = "#F7F7FA"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

